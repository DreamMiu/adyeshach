name: Adyeshach Build
on:
  push:
    branches:
      - 2.0
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4  # 也建议升级到最新版本
      
      - name: cache gradle packages
        uses: actions/cache@v4  # 升级到 v4
        with:
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
      
      - name: validate gradle wrapper
        uses: gradle/wrapper-validation-action@v1
      
      - name: setup jdk 17
        uses: actions/setup-java@v4  # 升级到最新版本
        with:
          distribution: 'temurin'  # 建议使用 temurin 而不是 adopt
          java-version: '17'
      
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      
      # 第一次构建
      - name: build
        id: build_1
        run: ./gradlew build
      
      # 第二次构建
      - name: build (retry 1)
        id: build_2
        if: steps.build_1.outcome == 'failure'
        run: ./gradlew build
      
      # 第三次构建
      - name: build (retry 2)
        id: build_3
        if: steps.build_2.outcome == 'failure'
        run: ./gradlew build
      
      # 第四次构建
      - name: build (retry 3)
        id: build_4
        if: steps.build_3.outcome == 'failure'
        run: ./gradlew build
      
      - name: Upload adyeshach
        uses: actions/upload-artifact@v4  # 升级到 v4
        with:
          name: adyeshach
          path: build/libs/*.jar
